<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
{{HREFLANG_TAGS}}

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:image" content="https://sdcardchecker.com/img/og-category.webp">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:site_name" content="SD Card Checker">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{META_DESCRIPTION}}">

  <script type="application/ld+json">
  {{BREADCRUMB_SCHEMA}}
  </script>
  {{FAQ_SCHEMA}}

  <link rel="stylesheet" href="/assets/css/tailwind.css">
  <link rel="stylesheet" href="/assets/css/modern.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="/assets/js/search.js"></script>
  {{GROW_SCRIPT}}
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100">
  {{HEADER}}

  <div class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <nav aria-label="breadcrumb" class="text-sm text-slate-600 flex flex-wrap items-center gap-2">
        {{BREADCRUMB_HTML}}
      </nav>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 py-12 flex flex-col md:flex-row gap-8">
    <main id="primary" class="content-area blog-main-content entry-content journey-content flex-1 min-w-0">
      {{CONTENT}}
    </main>

    {{SIDEBAR}}
  </div>

  {{FOOTER}}
</body>
</html>
